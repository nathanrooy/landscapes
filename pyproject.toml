[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "landscapes"
version = "0.0.13"
description = "A Python library of standardized optimization test functions"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE.txt"]
authors = [
    { name = "Nathan A. Rooy", email = "nathanrooy@gmail.com" },
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
]

[project.urls]
Homepage = "https://github.com/nathanrooy/landscapes"
Repository = "https://github.com/nathanrooy/landscapes"
Issues = "https://github.com/nathanrooy/landscapes/issues"

[tool.setuptools.packages.find]
where = ["."]
include = ["landscapes*"]

